{% extends 'player/base.html' %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h1>CasaMusic</h1>
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register here</a>.</p>
</div>
{% endblock %}
